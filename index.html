<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <base href="/">
    <title>Active Theory · Creative Digital Experiences</title>
    <meta name="description" content="Founded in 2012. We blend story, art &amp; technology as an in-house team of passionate makers.">
    <meta property="og:title" content="Active Theory · Creative Digital Experiences">
    <meta property="og:image" content="assets/img/social.jpg">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- WebGL-style ambient canvas (graceful 2D fallback) -->
    <canvas id="Stage" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <!-- Loader -->
    <div id="loader" class="loader" aria-live="polite">
        <div class="loader__mark"><span class="slash">///</span><span id="loadPct">0</span></div>
    </div>

    <!-- Fixed chrome -->
    <header class="chrome" id="chrome">
        <a class="brand" href="#/" data-link aria-label="Active Theory home">
            <span class="brand__glyph">AT</span>
            <span class="brand__word">ACTIVE<br>THEORY</span>
        </a>
        <nav class="nav" id="nav" aria-label="Primary">
            <a href="#/work" data-link data-route="work">Work</a>
            <a href="#/about" data-link data-route="about">About</a>
            <a href="#/contact" data-link data-route="contact">Contact</a>
        </nav>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span>
        </button>
    </header>

    <div class="index" id="index" aria-hidden="true">01 / 05</div>

    <!-- Routed views -->
    <main id="app" class="app" role="main"></main>

    <footer class="foot" id="foot">
        <span>© <span id="year"></span> Active Theory · study rebuild</span>
        <span class="foot__loc">LOS ANGELES — AMSTERDAM — REMOTE</span>
    </footer>

    <!-- Route transition wipe -->
    <div class="wipe" id="wipe" aria-hidden="true"><span class="wipe__line"></span></div>

    <!-- Custom cursor -->
    <div class="cursor" id="cursor" aria-hidden="true"><span class="cursor__dot"></span><span class="cursor__ring"></span><span class="cursor__label" id="cursorLabel"></span></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/shaderfield.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
