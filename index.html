<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <base href="/">
  <title>Active Theory · Creative Digital Experiences</title>
  <meta name="description" content="Founded in 2012. We blend story, art & technology as an in-house team of passionate makers.">
  <meta property="og:image" content="assets/img/social.jpg">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- WebGL stage (glass slab + orbital rings + volumetric space) -->
  <canvas id="Stage" aria-hidden="true"></canvas>
  <!-- 2D overlay: intro energy-core + edge mouse streams -->
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <!-- Intro energy-core drawn on #fx; accessible progress text -->
  <div id="loader" class="loader" aria-live="polite"><span id="loadPct" class="sr-only">Loading 0%</span></div>

  <!-- Minimal chrome -->
  <button class="audio" id="audio" aria-label="Toggle audio" aria-pressed="false">
    <span class="audio__bars"><i></i><i></i><i></i></span><span class="audio__label">Toggle Audio</span>
  </button>

  <!-- Pill: pause | progress | menu (reacts to scroll velocity) -->
  <div class="pill" id="pill">
    <button class="pill__pause" id="pause" aria-label="Pause motion" aria-pressed="false"><span></span><span></span></button>
    <div class="pill__track" id="track"><span class="pill__fill" id="trackFill"></span><span class="pill__knob" id="trackKnob"></span></div>
    <button class="pill__menu" id="menuBtn" aria-label="Open menu"><span></span><span></span><span></span></button>
  </div>

  <!-- Scene overlay: one DOM node per scene, crossfaded by wheel progress -->
  <main id="scenes" class="scenes" role="main"></main>

  <!-- Bottom-left scene index / hint -->
  <div class="hud" id="hud">
    <span class="hud__index" id="hudIndex">01 <i>/</i> 05</span>
    <span class="hud__hint" id="hudHint">Scroll to explore</span>
  </div>

  <!-- Fullscreen menu -->
  <div class="menu" id="menu" aria-hidden="true">
    <div class="menu__logo">AT</div>
    <nav class="menu__nav" aria-label="Primary">
      <a href="#/work" data-link>Work</a>
      <a href="#/about" data-link>About</a>
      <a href="#/contact" data-link>Contact</a>
    </nav>
    <div class="menu__meta">Active Theory · Creative Digital Experiences · Est. 2012</div>
  </div>

  <div class="scanlines" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"><span class="cursor__dot"></span><span class="cursor__ring"></span></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/shaderfield.js"></script>
  <script src="assets/js/portal.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
